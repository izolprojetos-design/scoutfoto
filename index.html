    <script>
      // Apply theme preference before render to avoid FOUC and respect dark mode
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          var bg = isDark ? '#0f1f17' : '#f4f7f6';
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = bg;
          document.addEventListener('DOMContentLoaded', function () {
            if (document.body) document.body.style.backgroundColor = bg;
            var loader = document.getElementById('initial-loader');
            if (loader) loader.style.color = isDark ? '#e8e3d6' : '#0a3d2e';
          });
        } catch (e) {}
      })();
    </script>

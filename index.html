      // Note: do NOT override the initial-loader background (kept brand green to match the PWA splash).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <script>
      // Clean start: removed recovery UI per user request.
      // The initial-loader will remain until React mounts.
      (function () {
        var loader = document.getElementById('initial-loader');
        if (!loader) return;
        var root = document.getElementById('root');
        if (!root) return;

        var observer = new MutationObserver(function () {
          if (!document.getElementById('initial-loader')) {
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
